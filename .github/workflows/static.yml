<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>#ARISE — Official Store</title>

<style>
* {
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
}

header {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
        radial-gradient(circle at center, #450000 0%, #120000 35%, #050505 70%);
    padding: 30px;
}

.logo {
    font-size: 90px;
    font-weight: 900;
    color: #ff1b1b;
    text-shadow: 0 0 35px #ff0000;
}

.subtitle {
    font-size: 20px;
    color: #ccc;
    margin-top: 15px;
}

.buttons {
    margin-top: 30px;
}

.button {
    display: inline-block;
    padding: 15px 28px;
    margin: 8px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    color: white;
    background: #e50914;
    transition: 0.2s;
}

.button:hover {
    background: #ff3030;
    transform: translateY(-2px);
}

.discord {
    background: #222;
}

section {
    max-width: 1100px;
    margin: auto;
    padding: 70px 20px;
}

h2 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 40px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 28px;
    text-align: center;
    transition: 0.2s;
}

.card:hover {
    border-color: #ff1717;
    transform: translateY(-5px);
}

.card h3 {
    font-size: 23px;
    margin-bottom: 15px;
}

.price {
    color: #ff2020;
    font-size: 26px;
    font-weight: bold;
}

.card p {
    color: #aaa;
    line-height: 1.5;
    margin-top: 15px;
}

.order {
    background: #0d0d0d;
    border-left: 4px solid #e50914;
    border-radius: 10px;
    padding: 30px;
    max-width: 800px;
    margin: auto;
}

.order p {
    color: #bbb;
    line-height: 1.8;
}

footer {
    text-align: center;
    padding: 35px;
    border-top: 1px solid #222;
    color: #777;
}

.red {
    color: #ff2020;
}

@media (max-width: 600px) {
    .logo {
        font-size: 60px;
    }

    h2 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>

<div>

<div class="logo">#ARISE</div>

<p class="subtitle">
Private Maps • Cave Mods • Dino Breeders • In-Game Ammo
</p>

<div class="buttons">

<a class="button"
href="JOUW_DISCORD_LINK"
target="_blank">
JOIN DISCORD
</a>

<a class="button"
href="JOUW_STRIPE_LINK"
target="_blank">
PAY WITH STRIPE
</a>

</div>

</div>

</header>


<section>

<h2>Our <span class="red">Products</span></h2>

<div class="products">

<div class="card">

<h3>Private Maps</h3>

<div class="price">€20 – €100</div>

<p>
Private map options. Contact us through Discord
for current availability and details.
</p>

</div>


<div class="card">

<h3>Cave Mods</h3>

<div class="price">€5 – €50</div>

<p>
Custom cave and mod options.
Ask in Discord for available options.
</p>

</div>


<div class="card">

<h3>Dino Breeders</h3>

<div class="price">€5 – €50</div>

<p>
Dino breeder options and available packages.
Contact us through Discord.
</p>

</div>


<div class="card">

<h3>In-Game Ammo</h3>

<div class="price">€5 – €50</div>

<p>
Virtual/in-game ammunition and packages.
Check Discord for current availability.
</p>

</div>

</div>

</section>


<section>

<h2>How To <span class="red">Order</span></h2>

<div class="order">

<p>
<strong>1.</strong> Join our Discord server.<br>

<strong>2.</strong> Choose the product you want.<br>

<strong>3.</strong> Contact our team through Discord.<br>

<strong>4.</strong> Follow the payment instructions.<br>

<strong>5.</strong> Keep your order information until the order is completed.
</p>

</div>

</section>


<section>

<h2>About <span class="red">#ARISE</span></h2>

<div class="order">

<p>
Welcome to the official #ARISE store.
We provide digital and in-game products for our community.
For questions, availability and support, please join our Discord.
</p>

</div>

</section>


<footer>

© 2026 #ARISE — Official Store

</footer>

</body>
</html>
