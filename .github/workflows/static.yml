<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>#ARISE — Official Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            line-height: 1.6;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(150, 0, 0, 0.45) 0%,
                    rgba(60, 0, 0, 0.25) 30%,
                    #050505 70%
                );
        }

        .hero {
            max-width: 900px;
        }

        .logo {
            font-size: clamp(55px, 10vw, 110px);
            font-weight: 900;
            letter-spacing: 4px;
            color: #ff2020;

            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.8),
                0 0 30px rgba(255, 0, 0, 0.5),
                0 0 70px rgba(255, 0, 0, 0.25);
        }

        .subtitle {
            margin-top: 15px;
            color: #bdbdbd;
            font-size: clamp(15px, 2vw, 20px);
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-block;
            padding: 15px 28px;

            border-radius: 8px;

            text-decoration: none;
            font-weight: 700;

            color: #ffffff;
            background: #e50914;

            border: 1px solid #ff3030;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            background: #ff2525;
            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(255, 0, 0, 0.25);
        }

        .discord {
            background: #222222;
            border-color: #444444;
        }

        .discord:hover {
            background: #333333;
        }

        /* =========================
           SECTIONS
        ========================= */

        section {
            max-width: 1100px;
            margin: auto;
            padding: 90px 20px;
        }

        .section-title {
            text-align: center;
            font-size: clamp(30px, 5vw, 42px);
            margin-bottom: 45px;
        }

        .red {
            color: #ff2020;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));

            gap: 22px;
        }

        .card {
            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0c0c0c
                );

            border: 1px solid #292929;
            border-radius: 15px;

            padding: 30px;

            text-align: center;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-7px);

            border-color: #ff2020;

            box-shadow:
                0 15px 40px rgba(255, 0, 0, 0.12);
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .price {
            color: #ff2020;
            font-size: 25px;
            font-weight: 800;
        }

        .card p {
            color: #999999;
            margin-top: 15px;
            font-size: 15px;
        }

        /* =========================
           ORDER
        ========================= */

        .order-box {
            max-width: 800px;
            margin: auto;

            background: #0e0e0e;

            border: 1px solid #292929;
            border-left: 4px solid #e50914;

            border-radius: 12px;

            padding: 35px;
        }

        .order-step {
            display: flex;
            gap: 15px;

            margin-bottom: 20px;

            color: #cccccc;
        }

        .order-step:last-child {
            margin-bottom: 0;
        }

        .number {
            min-width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e50914;
            color: white;

            font-weight: 800;
        }

        /* =========================
           ABOUT
        ========================= */

        .about-box {
            max-width: 800px;
            margin: auto;

            padding: 35px;

            background: #0e0e0e;

            border: 1px solid #292929;
            border-radius: 12px;

            text-align: center;
        }

        .about-box p {
            color: #aaaaaa;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 40px 20px;

            border-top: 1px solid #222222;

            color: #666666;
            font-size: 14px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                min-height: 80vh;
            }

            section {
                padding: 65px 15px;
            }

            .button {
                width: 100%;
                max-width: 300px;
            }

            .order-box,
            .about-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HERO
    ========================= -->

    <header>

        <div class="hero">

            <div class="logo">
                #ARISE
            </div>

            <p class="subtitle">
                Private Maps • Cave Mods • Dino Breeders • In-Game Ammo
            </p>

            <div class="buttons">

                <!-- VUL HIER JE DISCORD LINK IN -->
                <a
                    class="button discord"
                    href="https://discord.gg/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    JOIN DISCORD
                </a>

                <!-- VUL HIER JE STRIPE LINK IN -->
                <a
                    class="button"
                    href="https://buy.stripe.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    PAY WITH STRIPE
                </a>

            </div>

        </div>

    </header>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <section id="products">

        <h2 class="section-title">
            Our <span class="red">Products</span>
        </h2>

        <div class="products">

            <div class="card">

                <div class="card-icon">🗺️</div>

                <h3>
                    Private Maps
                </h3>

                <div class="price">
                    €20 – €100
                </div>

                <p>
                    Private map options for your community.
                    Contact us through Discord for availability
                    and details.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">⛰️</div>

                <h3>
                    Cave Mods
                </h3>

                <div class="price">
                    €5 – €50
                </div>

                <p>
                    Custom cave and modification options.
                    Ask us on Discord about the available options.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">🦖</div>

                <h3>
                    Dino Breeders
                </h3>

                <div class="price">
                    €5 – €50
                </div>

                <p>
                    Dino breeder options and packages.
                    Contact our team for current availability.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">📦</div>

                <h3>
                    In-Game Ammo
                </h3>

                <div class="price">
                    €5 – €50
                </div>

                <p>
                    Virtual in-game ammunition and packages.
                    Check Discord for current availability.
                </p>

            </div>

        </div>

    </section>


    <!-- =========================
         ORDER
    ========================= -->

    <section id="order">

        <h2 class="section-title">
            How To <span class="red">Order</span>
        </h2>

        <div class="order-box">

            <div class="order-step">
                <div class="number">1</div>
                <div>
                    Join our Discord server.
                </div>
            </div>

            <div class="order-step">
                <div class="number">2</div>
                <div>
                    Choose the product you want.
                </div>
            </div>

            <div class="order-step">
                <div class="number">3</div>
                <div>
                    Contact our team through Discord.
                </div>
            </div>

            <div class="order-step">
                <div class="number">4</div>
                <div>
                    Follow the payment instructions.
                </div>
            </div>

            <div class="order-step">
                <div class="number">5</div>
                <div>
                    Keep your order information until
                    the order has been completed.
                </div>
            </div>

        </div>

    </section>


    <!-- =========================
         ABOUT
    ========================= -->

    <section id="about">

        <h2 class="section-title">
            About <span class="red">#ARISE</span>
        </h2>

        <div class="about-box">

            <p>
                Welcome to the official #ARISE store.
                We provide digital and in-game products
                for our community.
                <br><br>
                For questions, availability and support,
                please join our Discord server.
            </p>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © 2026 #ARISE — Official Store

    </footer>

</body>
</html>
